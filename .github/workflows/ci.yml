name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: securescope
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: securescope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U securescope" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECURESCOPE_TEST_DATABASE_URL: postgresql+psycopg://securescope:ci-only-password@localhost:5432/securescope_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: System libraries and fonts for PDF reports
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose --env-file .env.example build
  e2e:
    # Real Chromium against the real backend on PostgreSQL: no mocks. Includes axe accessibility checks.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: securescope
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: securescope_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U securescope" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://securescope:ci-only-password@localhost:5432/securescope_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: System libraries and fonts for PDF reports
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the secrets check below reads the whole history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install scanners
        run: pip install bandit==1.9.4 pip-audit==2.10.1 semgrep==1.181.0
      - name: Secrets (token shapes in tracked files and in every commit)
        run: python scripts/scan_secrets.py --history
      - name: Bandit (Python static analysis, application code)
        run: bandit -q -r backend/app -x backend/app/tests
      - name: pip-audit (known vulnerabilities in pinned Python dependencies)
        run: pip-audit -r backend/requirements.txt --progress-spinner off
      - name: npm audit (known vulnerabilities, high and above)
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Semgrep (OWASP Top Ten and Python rules)
        run: semgrep scan --config p/python --config p/owasp-top-ten --config p/typescript --metrics off --error backend/app frontend/src
      - name: Trivy (dependency vulnerabilities, secrets, Dockerfile and Compose misconfiguration)
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/aquasecurity/trivy:0.58.0 \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs frontend/node_modules .
