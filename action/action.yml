name: "SecureScope website security scan"
description: >-
  Runs a passive SecureScope scan of a website you have verified, and fails the job when the score is too low
  or findings of a chosen severity are present. The result is a heuristic, not a guarantee of security.
author: "SecureScope"
branding:
  icon: "shield"
  color: "green"

inputs:
  api-key:
    description: "A SecureScope API token (Integrations > API tokens for CI). Store it as an encrypted repository secret."
    required: true
  url:
    description: "The address to scan. Its host must be a site you have verified in SecureScope."
    required: true
  min-score:
    description: "Fail the job when the score is below this number (0 to 100). Empty means no score limit."
    required: false
    default: ""
  fail-on:
    description: "Fail the job when a finding of this severity or higher is present: critical, high, medium, low or none."
    required: false
    default: "high"
  timeout-minutes:
    description: "How long to wait for the scan to finish (1 to 60)."
    required: false
    default: "10"
  api-url:
    description: "The SecureScope API address. Only change this if you were given a different one."
    required: false
    default: "https://getsecurescope.com/api/v1"

outputs:
  scan-id:
    description: "The id of the scan."
    value: ${{ steps.scan.outputs.scan-id }}
  score:
    description: "The security score (0 to 100)."
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: "The grade (A to F)."
    value: ${{ steps.scan.outputs.grade }}
  passed:
    description: "true when the score and severity rules you set were met."
    value: ${{ steps.scan.outputs.passed }}

runs:
  using: "composite"
  steps:
    - id: scan
      shell: bash
      # Inputs reach the script only as environment variables, never pasted into the script text.
      env:
        SS_API_KEY: ${{ inputs.api-key }}
        SS_URL: ${{ inputs.url }}
        SS_MIN_SCORE: ${{ inputs.min-score }}
        SS_FAIL_ON: ${{ inputs.fail-on }}
        SS_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        SS_API_URL: ${{ inputs.api-url }}
      run: bash "$GITHUB_ACTION_PATH/scan.sh"
